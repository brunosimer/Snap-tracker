<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snap Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a1a13;
    --surface:#0f2419;
    --surface2:#16321f;
    --line:#26452f;
    --ink:#f2f3ea;
    --ink-muted:#8fae9c;
    --gold:#e7b740;
    --gold-dim:#8a6c2a;
    --red:#c1443d;
    --blue:#4e86a6;
    --green-play:#5a9a63;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #12301f 0%, transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 40px),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px;}

  /* HEADER */
  header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 14px;}
  .brand{font-family:'Teko',sans-serif;font-weight:700;font-size:30px;letter-spacing:0.5px;color:var(--gold);line-height:1;}
  .brand small{display:block;font-family:'Inter';font-size:10.5px;font-weight:500;letter-spacing:1.5px;color:var(--ink-muted);text-transform:uppercase;margin-top:2px;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .tab-btn{border:none;background:transparent;color:var(--ink-muted);font-family:'Inter';font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .tab-btn.active{background:var(--gold);color:#1a1305;}

  /* SCOREBOARD */
  .scoreboard{
    background:linear-gradient(180deg,#0d2317,#0a1a13);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px 10px;
    margin-bottom:12px;
    box-shadow:inset 0 0 0 1px rgba(231,183,64,0.04), 0 6px 20px rgba(0,0,0,0.35);
  }
  .teams-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
  .team-block{display:flex;flex-direction:column;gap:2px;}
  .team-block.right{align-items:flex-end;text-align:right;}
  .team-name-input{
    background:transparent;border:none;color:var(--ink);font-family:'Inter';font-weight:700;
    font-size:12.5px;letter-spacing:0.5px;text-transform:uppercase;width:100%;padding:0;
  }
  .team-block.right .team-name-input{text-align:right;}
  .team-name-input:focus{outline:none;color:var(--gold);}
  .score{font-family:'Teko';font-weight:700;font-size:46px;line-height:0.9;color:var(--ink);font-variant-numeric:tabular-nums;}
  .score-controls{display:flex;gap:4px;margin-top:4px;}
  .team-block.right .score-controls{flex-direction:row-reverse;}
  .score-btn{
    background:var(--surface2);border:1px solid var(--line);color:var(--ink-muted);
    font-family:'IBM Plex Mono';font-size:10px;font-weight:600;border-radius:6px;
    padding:3px 6px;cursor:pointer;
  }
  .score-btn:active{background:var(--gold);color:#1a1305;}
  .vs-col{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .quarter-chip{
    font-family:'Teko';font-weight:600;font-size:20px;color:var(--gold);
    border:1px solid var(--gold-dim);border-radius:8px;padding:1px 10px;letter-spacing:1px;
  }
  .clock-label{font-size:9px;color:var(--ink-muted);letter-spacing:1px;text-transform:uppercase;}

  .dd-readout{
    margin-top:12px;background:#081209;border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  }
  .dd-main{font-family:'Teko';font-weight:700;font-size:38px;color:var(--gold);letter-spacing:1px;
    text-shadow:0 0 14px rgba(231,183,64,0.35);font-variant-numeric:tabular-nums;transition:opacity .12s;}
  .dd-side{text-align:right;}
  .dd-poss-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);}
  .dd-poss-team{font-family:'Inter';font-weight:700;font-size:13px;color:var(--ink);}
  .chain-ticks{display:flex;gap:3px;margin-top:8px;}
  .tick{flex:1;height:4px;border-radius:2px;background:var(--surface2);}
  .tick.on{background:var(--gold);}

  .quarter-row{display:flex;gap:6px;margin-top:10px;}
  .q-btn{
    flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--ink-muted);
    font-family:'Teko';font-weight:600;font-size:16px;padding:5px 0;border-radius:8px;cursor:pointer;letter-spacing:1px;
  }
  .q-btn.active{background:var(--gold);color:#1a1305;border-color:var(--gold);}

  .poss-row{display:flex;gap:6px;margin-top:8px;}
  .poss-btn{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-muted);
    font-family:'Inter';font-weight:700;font-size:11.5px;letter-spacing:0.5px;text-transform:uppercase;
    padding:8px 4px;border-radius:9px;cursor:pointer;
  }
  .poss-btn.active{background:rgba(231,183,64,0.14);border-color:var(--gold);color:var(--gold);}

  /* NOTE INPUT */
  .note-input{
    width:100%;margin-top:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    font-family:'Inter';font-size:12.5px;padding:9px 11px;border-radius:9px;
  }
  .note-input::placeholder{color:var(--ink-muted);}
  .note-input:focus{outline:none;border-color:var(--gold-dim);}

  /* PLAY GRID */
  .section-label{font-family:'Inter';font-weight:700;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);margin:16px 2px 8px;}
  .play-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .play-btn{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;
    color:var(--ink);font-family:'Inter';font-weight:600;font-size:13.5px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;
  }
  .play-btn .icon{font-size:18px;}
  .play-btn:active{transform:scale(0.97);}
  .play-btn.run{border-left:3px solid var(--gold);}
  .play-btn.pass{border-left:3px solid var(--blue);}
  .play-btn.turnover{border-left:3px solid var(--red);}
  .play-btn.special{border-left:3px solid var(--ink-muted);}
  .play-btn.score{background:linear-gradient(135deg,rgba(231,183,64,0.18),var(--surface));border-left:3px solid var(--gold);grid-column:1 / -1;}

  /* YARDAGE PANEL */
  .yard-panel{background:var(--surface);border:1px solid var(--gold-dim);border-radius:14px;padding:14px;margin-top:4px;}
  .yard-title{font-family:'Inter';font-weight:700;font-size:13px;color:var(--gold);margin-bottom:10px;}
  .yard-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    background:var(--surface2);border:1px solid var(--line);color:var(--ink);
    font-family:'IBM Plex Mono';font-weight:600;font-size:13px;padding:8px 4px;border-radius:8px;
    cursor:pointer;min-width:44px;text-align:center;
  }
  .chip:active{background:var(--gold);color:#1a1305;}
  .yard-custom{display:flex;gap:8px;margin-top:10px;}
  .yard-custom input{
    flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--ink);
    font-family:'IBM Plex Mono';font-size:14px;padding:8px 10px;border-radius:8px;
  }
  .yard-custom button, .cancel-btn{
    background:var(--gold);color:#1a1305;border:none;font-family:'Inter';font-weight:700;
    font-size:12.5px;padding:8px 16px;border-radius:8px;cursor:pointer;
  }
  .cancel-btn{background:transparent;border:1px solid var(--line);color:var(--ink-muted);margin-top:8px;width:100%;}

  /* LOG */
  .log-item{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;
  }
  .log-left{display:flex;flex-direction:column;gap:2px;}
  .log-tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--ink-muted);}
  .log-desc{font-size:13px;font-weight:600;}
  .log-note{font-size:11px;color:var(--ink-muted);font-style:italic;}
  .log-yards{font-family:'Teko';font-weight:700;font-size:22px;min-width:48px;text-align:right;}
  .log-yards.pos{color:#7fc788;}
  .log-yards.neg{color:var(--red);}
  .del-btn{background:none;border:none;color:var(--ink-muted);font-size:16px;cursor:pointer;padding:2px 4px;}
  .empty-state{text-align:center;color:var(--ink-muted);font-size:12.5px;padding:30px 10px;}

  /* STATS */
  .stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .stat-num{font-family:'Teko';font-weight:700;font-size:30px;color:var(--gold);line-height:1;}
  .stat-label{font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
  .chart-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .chart-title{font-family:'Inter';font-weight:700;font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
  .filter-row{display:flex;gap:6px;margin-bottom:12px;}
  .filter-btn{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-muted);
    font-family:'Inter';font-weight:600;font-size:11.5px;padding:8px;border-radius:9px;cursor:pointer;}
  .filter-btn.active{background:rgba(231,183,64,0.14);border-color:var(--gold);color:var(--gold);}

  .footer-actions{display:flex;gap:8px;margin-top:16px;}
  .ghost-btn{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-muted);
    font-family:'Inter';font-weight:600;font-size:12px;padding:10px;border-radius:10px;cursor:pointer;}
  .ghost-btn.danger{color:var(--red);border-color:rgba(193,68,61,0.4);}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#1a1305;font-family:'Inter';font-weight:700;font-size:12.5px;
    padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .hidden{display:none !important;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:340px;width:100%;}
  .modal h3{font-family:'Teko';font-weight:600;font-size:22px;color:var(--gold);margin:0 0 8px;}
  .modal p{font-size:12.5px;color:var(--ink-muted);margin:0 0 16px;line-height:1.5;}
  .modal-actions{display:flex;gap:8px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">SNAP TRACKER<small>jogada a jogada</small></div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="jogo">Jogo</button>
      <button class="tab-btn" data-tab="stats">Stats</button>
    </div>
  </header>

  <!-- ===== TAB: JOGO ===== -->
  <div id="tab-jogo">

    <div class="scoreboard">
      <div class="teams-row">
        <div class="team-block">
          <input class="team-name-input" id="teamAName" maxlength="16" value="MEU TIME">
          <div class="score" id="scoreA">0</div>
          <div class="score-controls">
            <button class="score-btn" data-team="A" data-pts="6">+6</button>
            <button class="score-btn" data-team="A" data-pts="3">+3</button>
            <button class="score-btn" data-team="A" data-pts="2">+2</button>
            <button class="score-btn" data-team="A" data-pts="1">+1</button>
            <button class="score-btn" data-team="A" data-pts="-1">−</button>
          </div>
        </div>
        <div class="vs-col">
          <div class="quarter-chip" id="quarterChip">Q1</div>
          <div class="clock-label">placar</div>
        </div>
        <div class="team-block right">
          <input class="team-name-input" id="teamBName" maxlength="16" value="ADVERSÁRIO">
          <div class="score" id="scoreB">0</div>
          <div class="score-controls">
            <button class="score-btn" data-team="B" data-pts="6">+6</button>
            <button class="score-btn" data-team="B" data-pts="3">+3</button>
            <button class="score-btn" data-team="B" data-pts="2">+2</button>
            <button class="score-btn" data-team="B" data-pts="1">+1</button>
            <button class="score-btn" data-team="B" data-pts="-1">−</button>
          </div>
        </div>
      </div>

      <div class="dd-readout">
        <div>
          <div class="dd-main" id="ddMain">1ª & 10</div>
          <div class="chain-ticks" id="chainTicks"></div>
        </div>
        <div class="dd-side">
          <div class="dd-poss-label">na posse</div>
          <div class="dd-poss-team" id="ddPossTeam">Meu Time</div>
        </div>
      </div>

      <div class="quarter-row">
        <button class="q-btn active" data-q="1">Q1</button>
        <button class="q-btn" data-q="2">Q2</button>
        <button class="q-btn" data-q="3">Q3</button>
        <button class="q-btn" data-q="4">Q4</button>
        <button class="q-btn" data-q="OT">OT</button>
      </div>

      <div class="poss-row">
        <button class="poss-btn active" data-poss="A">🏈 Posse: Meu Time</button>
        <button class="poss-btn" data-poss="B">🏈 Posse: Adversário</button>
      </div>

      <input class="note-input" id="noteInput" placeholder="Nota rápida (opcional) — ex: nome do jogador">
    </div>

    <div class="section-label">Registrar snap</div>
    <div class="play-grid" id="playGrid">
      <button class="play-btn run" data-type="corrida"><span class="icon">🏃</span>Corrida</button>
      <button class="play-btn pass" data-type="passe-completo"><span class="icon">🎯</span>Passe completo</button>
      <button class="play-btn pass" data-type="passe-incompleto"><span class="icon">🙅</span>Passe incompleto</button>
      <button class="play-btn turnover" data-type="sack"><span class="icon">💥</span>Sack</button>
      <button class="play-btn turnover" data-type="interceptacao"><span class="icon">🔁</span>Interceptação</button>
      <button class="play-btn turnover" data-type="fumble"><span class="icon">🌀</span>Fumble perdido</button>
      <button class="play-btn special" data-type="penalidade"><span class="icon">🚩</span>Penalidade</button>
      <button class="play-btn special" data-type="special-teams"><span class="icon">🦵</span>Special teams</button>
      <button class="play-btn score" data-type="touchdown"><span class="icon">🏆</span>Touchdown</button>
    </div>

    <div class="yard-panel hidden" id="yardPanel">
      <div class="yard-title" id="yardTitle">Quantas jazidas?</div>
      <div class="yard-chips" id="yardChips"></div>
      <div class="yard-custom">
        <input type="number" id="yardCustom" placeholder="valor exato">
        <button id="yardCustomBtn">OK</button>
      </div>
      <button class="cancel-btn" id="yardCancelBtn">Cancelar</button>
    </div>

    <div class="section-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Últimos snaps</span>
    </div>
    <div id="logList"></div>

    <div class="footer-actions">
      <button class="ghost-btn" id="exportBtn">Exportar CSV</button>
      <button class="ghost-btn" id="newGameBtn">Novo jogo</button>
      <button class="ghost-btn danger" id="resetBtn">Limpar tudo</button>
    </div>
  </div>

  <!-- ===== TAB: STATS ===== -->
  <div id="tab-stats" class="hidden">
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">Ambos os times</button>
      <button class="filter-btn" data-filter="A">Meu Time</button>
      <button class="filter-btn" data-filter="B">Adversário</button>
    </div>

    <div class="stat-cards" id="statCards"></div>

    <div class="chart-card">
      <div class="chart-title">Corrida vs. Passe</div>
      <canvas id="chartRunPass" height="180"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-title">Jazidas por quarter</div>
      <canvas id="chartYardsQ" height="180"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-title">Distribuição de resultados</div>
      <canvas id="chartOutcomes" height="200"></canvas>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay hidden" id="confirmModal">
  <div class="modal">
    <h3 id="modalTitle">Confirmar</h3>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="cancel-btn" id="modalCancel" style="flex:1;">Cancelar</button>
      <button class="yard-custom button" id="modalConfirm" style="flex:1;background:var(--red);">Confirmar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = 'current-game';
  const PLAY_LABELS = {
    'corrida':'Corrida','passe-completo':'Passe completo','passe-incompleto':'Passe incompleto',
    'sack':'Sack','interceptacao':'Interceptação','fumble':'Fumble perdido',
    'penalidade':'Penalidade','special-teams':'Special teams','touchdown':'Touchdown'
  };
  const NO_YARD_TYPES = []; // all types get a yardage step, kept simple/consistent
  const TURNOVER_TYPES = ['interceptacao','fumble'];

  let state = {
    teamA:'MEU TIME', teamB:'ADVERSÁRIO',
    scoreA:0, scoreB:0,
    quarter:'1',
    possession:'A',
    down:1, distance:10,
    plays:[]
  };
  let pendingType = null;
  let loaded = false;

  // ---------- storage helpers ----------
  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state = Object.assign(state, parsed);
      }
    }catch(e){
      // no saved state yet
    }
    loaded = true;
    renderAll();
  }
  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    }catch(e){
      showToast('Erro ao salvar');
    }
  }

  // ---------- utility ----------
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=>t.classList.remove('show'), 1400);
  }
  function teamName(key){ return key==='A' ? state.teamA : state.teamB; }
  function otherTeam(key){ return key==='A' ? 'B' : 'A'; }

  // ---------- rendering ----------
  function renderScoreboard(){
    document.getElementById('teamAName').value = state.teamA;
    document.getElementById('teamBName').value = state.teamB;
    document.getElementById('scoreA').textContent = state.scoreA;
    document.getElementById('scoreB').textContent = state.scoreB;
    document.getElementById('quarterChip').textContent = 'Q'+state.quarter;
    document.querySelectorAll('.q-btn').forEach(b=>b.classList.toggle('active', b.dataset.q===state.quarter));
    document.querySelectorAll('.poss-btn').forEach(b=>b.classList.toggle('active', b.dataset.poss===state.possession));
    document.getElementById('ddPossTeam').textContent = teamName(state.possession);

    const downOrd = ['','1ª','2ª','3ª','4ª'][state.down] || (state.down+'ª');
    document.getElementById('ddMain').textContent = downOrd + ' & ' + state.distance;

    const ticks = document.getElementById('chainTicks');
    ticks.innerHTML = '';
    const total = 10;
    const progress = Math.max(0, Math.min(total, total - state.distance));
    for(let i=0;i<total;i++){
      const d = document.createElement('div');
      d.className = 'tick' + (i < progress ? ' on' : '');
      ticks.appendChild(d);
    }
  }

  function renderLog(){
    const list = document.getElementById('logList');
    if(state.plays.length===0){
      list.innerHTML = '<div class="empty-state">Nenhum snap registrado ainda.<br>Toque em um tipo de jogada acima para começar.</div>';
      return;
    }
    const items = state.plays.slice().reverse().slice(0,40);
    list.innerHTML = items.map(p=>{
      const yardsCls = p.yards>0 ? 'pos' : (p.yards<0 ? 'neg':'');
      const sign = p.yards>0 ? '+' : '';
      return `<div class="log-item" data-id="${p.id}">
        <div class="log-left">
          <div class="log-tag">SNAP #${p.snapNum} · Q${p.quarter} · ${p.downLabel} · ${teamNameSafe(p.possession)}</div>
          <div class="log-desc">${PLAY_LABELS[p.type]||p.type}</div>
          ${p.note ? `<div class="log-note">${escapeHtml(p.note)}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="log-yards ${yardsCls}">${sign}${p.yards}</div>
          <button class="del-btn" data-del="${p.id}">✕</button>
        </div>
      </div>`;
    }).join('');
  }
  function teamNameSafe(key){ return key==='A'?state.teamA:state.teamB; }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderAll(){
    renderScoreboard();
    renderLog();
  }

  // ---------- down/distance/possession logic ----------
  function flipPossession(){
    state.possession = otherTeam(state.possession);
    state.down = 1; state.distance = 10;
  }
  function resetSet(){ state.down = 1; state.distance = 10; }

  function applyPlay(type, yards){
    const beforeDown = state.down, beforeDist = state.distance, beforePoss = state.possession;
    const downLabel = ['','1ª','2ª','3ª','4ª'][beforeDown] || (beforeDown+'ª');

    if(type === 'touchdown'){
      if(state.possession==='A') state.scoreA += 6; else state.scoreB += 6;
      flipPossession();
    } else if(TURNOVER_TYPES.includes(type)){
      flipPossession();
    } else if(type === 'special-teams'){
      // punt / kickoff / FG attempt — treat as change of possession, reset set
      flipPossession();
    } else if(type === 'penalidade'){
      // yards applied to distance, down repeats (does not advance)
      state.distance = Math.max(1, state.distance - yards);
    } else {
      // corrida, passe completo/incompleto, sack
      const newDistance = state.distance - yards;
      if(newDistance <= 0){
        resetSet(); // first down achieved
      } else {
        state.down += 1;
        state.distance = newDistance;
        if(state.down > 4){
          // turnover on downs
          flipPossession();
        }
      }
    }

    const note = document.getElementById('noteInput').value.trim();
    const snapNum = state.plays.length + 1;
    state.plays.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      snapNum, quarter: state.quarter, type, yards,
      possession: beforePoss, downLabel: downLabel + ' & ' + beforeDist,
      note
    });
    document.getElementById('noteInput').value = '';
    saveState();
    renderAll();
  }

  // ---------- yardage panel ----------
  const YARD_CHIPS_STD = [-10,-5,-3,-2,-1,0,1,2,3,4,5,7,10,15,20,40];
  function openYardPanel(type){
    pendingType = type;
    document.getElementById('playGrid').classList.add('hidden');
    const panel = document.getElementById('yardPanel');
    panel.classList.remove('hidden');
    const label = PLAY_LABELS[type];
    document.getElementById('yardTitle').textContent =
      (type==='penalidade' ? 'Quantas jazidas de penalidade?' : `${label} — quantas jazidas?`);
    const chipsWrap = document.getElementById('yardChips');
    chipsWrap.innerHTML = '';
    YARD_CHIPS_STD.forEach(y=>{
      const c = document.createElement('div');
      c.className = 'chip';
      c.textContent = (y>0?'+':'') + y;
      c.addEventListener('click', ()=> confirmYard(y));
      chipsWrap.appendChild(c);
    });
    document.getElementById('yardCustom').value = '';
  }
  function closeYardPanel(){
    pendingType = null;
    document.getElementById('yardPanel').classList.add('hidden');
    document.getElementById('playGrid').classList.remove('hidden');
  }
  function confirmYard(y){
    if(pendingType==null) return;
    applyPlay(pendingType, y);
    closeYardPanel();
    showToast('Snap registrado');
  }

  // ---------- events: play grid ----------
  document.getElementById('playGrid').addEventListener('click', (e)=>{
    const btn = e.target.closest('.play-btn');
    if(!btn) return;
    const type = btn.dataset.type;
    if(type === 'touchdown'){
      applyPlay('touchdown', 0);
      showToast('Touchdown registrado! 🏆');
      return;
    }
    openYardPanel(type);
  });
  document.getElementById('yardCancelBtn').addEventListener('click', closeYardPanel);
  document.getElementById('yardCustomBtn').addEventListener('click', ()=>{
    const v = parseInt(document.getElementById('yardCustom').value, 10);
    if(!isNaN(v)) confirmYard(v);
  });

  // ---------- score / quarter / possession controls ----------
  document.querySelectorAll('.score-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const team = btn.dataset.team, pts = parseInt(btn.dataset.pts,10);
      if(team==='A') state.scoreA = Math.max(0, state.scoreA + (pts<0? -1: pts));
      else state.scoreB = Math.max(0, state.scoreB + (pts<0? -1: pts));
      saveState(); renderScoreboard();
    });
  });
  document.querySelectorAll('.q-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.quarter = btn.dataset.q; saveState(); renderScoreboard(); });
  });
  document.querySelectorAll('.poss-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.possession = btn.dataset.poss; state.down=1; state.distance=10;
      saveState(); renderScoreboard();
    });
  });
  document.getElementById('teamAName').addEventListener('change', e=>{ state.teamA = e.target.value || 'MEU TIME'; saveState(); renderAll(); });
  document.getElementById('teamBName').addEventListener('change', e=>{ state.teamB = e.target.value || 'ADVERSÁRIO'; saveState(); renderAll(); });

  // ---------- log delete ----------
  document.getElementById('logList').addEventListener('click', e=>{
    const btn = e.target.closest('[data-del]');
    if(!btn) return;
    const id = btn.dataset.del;
    state.plays = state.plays.filter(p=>p.id!==id);
    saveState(); renderAll();
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('tab-jogo').classList.toggle('hidden', tab!=='jogo');
      document.getElementById('tab-stats').classList.toggle('hidden', tab!=='stats');
      if(tab==='stats') renderStats(currentFilter);
    });
  });

  // ---------- export CSV ----------
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    if(state.plays.length===0){ showToast('Nada para exportar'); return; }
    const header = ['snap','quarter','posse','tipo','jazidas','down_distance_antes','nota'];
    const rows = state.plays.map(p=>[
      p.snapNum, p.quarter, teamNameSafe(p.possession), PLAY_LABELS[p.type]||p.type,
      p.yards, p.downLabel, (p.note||'').replace(/,/g,';')
    ]);
    const csv = [header.join(','), ...rows.map(r=>r.join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'snap-tracker.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---------- modal confirm (new game / reset) ----------
  let modalAction = null;
  function openModal(title, text, action){
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').textContent = text;
    modalAction = action;
    document.getElementById('confirmModal').classList.remove('hidden');
  }
  document.getElementById('modalCancel').addEventListener('click', ()=> document.getElementById('confirmModal').classList.add('hidden'));
  document.getElementById('modalConfirm').addEventListener('click', ()=>{
    document.getElementById('confirmModal').classList.add('hidden');
    if(modalAction) modalAction();
  });

  document.getElementById('newGameBtn').addEventListener('click', ()=>{
    openModal('Começar novo jogo?', 'O placar, o down/distance e o log de snaps atuais serão zerados. Os nomes dos times são mantidos.', ()=>{
      state.scoreA = 0; state.scoreB = 0; state.quarter='1'; state.possession='A';
      state.down=1; state.distance=10; state.plays=[];
      saveState(); renderAll();
      showToast('Novo jogo iniciado');
    });
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    openModal('Limpar tudo?', 'Isso apaga times, placar e todos os snaps salvos. Essa ação não pode ser desfeita.', ()=>{
      state = {teamA:'MEU TIME', teamB:'ADVERSÁRIO', scoreA:0, scoreB:0, quarter:'1', possession:'A', down:1, distance:10, plays:[]};
      saveState(); renderAll();
      showToast('Tudo limpo');
    });
  });

  // ---------- stats ----------
  let currentFilter = 'all';
  let chartRunPass, chartYardsQ, chartOutcomes;

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderStats(currentFilter);
    });
  });

  function filteredPlays(filter){
    if(filter==='all') return state.plays;
    return state.plays.filter(p=>p.possession===filter);
  }

  function renderStats(filter){
    const plays = filteredPlays(filter);
    const totalPlays = plays.length;
    const totalYards = plays.reduce((s,p)=> s + (isFinite(p.yards)?p.yards:0), 0);
    const runPlays = plays.filter(p=>p.type==='corrida').length;
    const passPlays = plays.filter(p=>p.type==='passe-completo'||p.type==='passe-incompleto').length;
    const turnovers = plays.filter(p=>TURNOVER_TYPES.includes(p.type)).length;
    const avgYards = totalPlays ? (totalYards/totalPlays).toFixed(1) : '0.0';

    document.getElementById('statCards').innerHTML = `
      <div class="stat-card"><div class="stat-num">${totalPlays}</div><div class="stat-label">Snaps</div></div>
      <div class="stat-card"><div class="stat-num">${totalYards}</div><div class="stat-label">Jazidas totais</div></div>
      <div class="stat-card"><div class="stat-num">${avgYards}</div><div class="stat-label">Jazidas / jogada</div></div>
      <div class="stat-card"><div class="stat-num">${turnovers}</div><div class="stat-label">Turnovers</div></div>
    `;

    const ctx1 = document.getElementById('chartRunPass').getContext('2d');
    const rpData = { runs: runPlays, completos: plays.filter(p=>p.type==='passe-completo').length, incompletos: plays.filter(p=>p.type==='passe-incompleto').length };
    if(chartRunPass) chartRunPass.destroy();
    chartRunPass = new Chart(ctx1, {
      type:'bar',
      data:{ labels:['Corrida','Passe completo','Passe incompleto'],
        datasets:[{ data:[rpData.runs, rpData.completos, rpData.incompletos],
          backgroundColor:['#e7b740','#4e86a6','#2f5266'], borderRadius:6 }] },
      options:{ plugins:{legend:{display:false}}, scales:{
        x:{ ticks:{color:'#8fae9c', font:{family:'Inter', size:10}}, grid:{color:'#1d3b28'} },
        y:{ ticks:{color:'#8fae9c'}, grid:{color:'#1d3b28'}, beginAtZero:true, precision:0 }
      }}
    });

    const quarters = ['1','2','3','4','OT'];
    const yardsByQ = quarters.map(q => plays.filter(p=>p.quarter===q).reduce((s,p)=>s+(isFinite(p.yards)?p.yards:0),0));
    const ctx2 = document.getElementById('chartYardsQ').getContext('2d');
    if(chartYardsQ) chartYardsQ.destroy();
    chartYardsQ = new Chart(ctx2, {
      type:'bar',
      data:{ labels:quarters.map(q=>'Q'+q),
        datasets:[{ data:yardsByQ, backgroundColor:'#e7b740', borderRadius:6 }] },
      options:{ plugins:{legend:{display:false}}, scales:{
        x:{ ticks:{color:'#8fae9c'}, grid:{display:false} },
        y:{ ticks:{color:'#8fae9c'}, grid:{color:'#1d3b28'} }
      }}
    });

    const outcomeCounts = {};
    plays.forEach(p=>{ outcomeCounts[p.type] = (outcomeCounts[p.type]||0) + 1; });
    const labels = Object.keys(outcomeCounts).map(k=>PLAY_LABELS[k]||k);
    const values = Object.values(outcomeCounts);
    const palette = ['#e7b740','#4e86a6','#2f5266','#c1443d','#a83832','#6b6b5f','#5a9a63','#8fae9c','#8a6c2a'];
    const ctx3 = document.getElementById('chartOutcomes').getContext('2d');
    if(chartOutcomes) chartOutcomes.destroy();
    chartOutcomes = new Chart(ctx3, {
      type:'doughnut',
      data:{ labels, datasets:[{ data: values, backgroundColor: palette, borderColor:'#0f2419', borderWidth:2 }] },
      options:{ plugins:{ legend:{ position:'bottom', labels:{ color:'#c9d6cd', font:{family:'Inter', size:10.5}, boxWidth:12, padding:10 } } } }
    });
  }

  // ---------- init ----------
  loadState();
})();
</script>
</body>
</html>
